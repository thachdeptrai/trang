<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRĂNG — kiểm tra responsive</title><style>body{margin:0;background:#13222c;color:#fff;font:16px system-ui}header{padding:12px;display:flex;gap:10px;align-items:center}button{padding:10px}iframe{display:block;width:390px;height:800px;border:1px solid #516877;margin:10px auto;background:#02070b;max-width:100%}</style><header>Khung kiểm tra giao diện <button data-width="360">360px</button><button data-width="390">390px</button><button data-width="768">768px</button><button data-width="1440">1440px</button></header><iframe src="../index.html" title="Bản xem responsive TRĂNG"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>document.querySelector('iframe').style.width=b.dataset.width+'px');</script></html>
